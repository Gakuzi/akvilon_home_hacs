---
open_gate:
  name: Открыть калитку
  description: Открыть указанную калитку/дверь по её идентификатору
  fields:
    gate_id:
      name: ID калитки
      description: Идентификатор калитки (например "1:101908")
      required: true
      example: "1:101908"
      selector:
        text:

start_viewer:
  name: Запустить веб-панель камер
  description: Запустить локальную веб-панель со всеми камерами (сетка, снимки, переключение)
  fields:
    port:
      name: Порт
      description: HTTP-порт панели (по умолчанию 8090)
      required: false
      default: 8090
      example: 8090
      selector:
        number:
          min: 1024
          max: 65535
    refresh:
      name: Интервал обновления снимков
      description: Интервал обновления скриншотов видимых камер в секундах
      required: false
      default: 12
      example: 12
      selector:
        number:
          min: 3
          max: 120

stop_viewer:
  name: Остановить веб-панель камер
  description: Остановить запущенную веб-панель камер
  fields: {}

ding_notify:
  name: Пуш о звонке домофона
  description: Отправить пуш-уведомление о вызове домофона через notify.<target> (опционально с кадром камеры). Автоматизация-дружественный сервис; без target уведомление не отправляется.
  fields:
    title:
      name: Заголовок
      description: Заголовок уведомления (по умолчанию «Звонок в домофон <имя>»)
      required: false
      example: "Звонок в домофон"
      selector:
        text:
    message:
      name: Текст
      description: Текст уведомления
      required: false
      example: "Кто-то звонит в домофон"
      selector:
        text:
          multiline: true
    target:
      name: target уведомления
      description: Имя notify-платформы, например mobile_app_iphone. Без target уведомление не отправляется.
      required: false
      example: "mobile_app_iphone"
      selector:
        text:
    camera_id:
      name: ID камеры
      description: ID камеры (например "2:101967"), с которой захватить кадр для уведомления (захват в executor)
      required: false
      example: "2:101967"
      selector:
        text:
    image:
      name: Готовое изображение
      description: Путь/URL/URI изображения для уведомления (приоритетнее camera_id)
      required: false
      selector:
        text: