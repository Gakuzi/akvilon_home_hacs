name: Release

# Публикация релиза в HACS при пуше git-тега.
# Тег вида: v1.1.0 (stable) или v1.2.0-beta1 (beta).
# HACS подхватит релиз по тегу и покажет уведомление об обновлении.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tag metadata
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate structure
        run: |
          test -f hacs.json || { echo "hacs.json missing"; exit 1; }
          test -f custom_components/akvilon_home/manifest.json || { echo "manifest missing"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Релиз ${{ github.ref_name }}

            Интеграция **Akvilon InHome** для Home Assistant.

            Установка: через HACS → добавьте репозиторий
            `https://github.com/Gakuzi/akvilon_home_hacs`
            (тип Integration), выберите ветку/релиз и нажмите **Download**.
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true