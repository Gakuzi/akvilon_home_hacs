<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="860" viewBox="0 0 1200 860"
     font-family="Segoe UI, Arial, sans-serif">

  <defs>
    <linearGradient id="bgLot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4e6"/>
      <stop offset="1" stop-color="#e2ecda"/>
    </linearGradient>
    <radialGradient id="greenZone" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#cfe5b5"/>
      <stop offset="1" stop-color="#b8d99a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#0b3d1f" flood-opacity="0.4"/>
    </filter>
    <marker id="camDot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7">
      <circle cx="5" cy="5" r="4" fill="#d62728" stroke="#fff" stroke-width="1.4"/>
    </marker>
    <g id="camIcon">
      <rect x="-17" y="-13" width="34" height="26" rx="4" fill="#1f2a44" stroke="#0b1526" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="-4" cy="0" r="9" fill="#3b4a6b"/>
      <circle cx="-4" cy="0" r="5" fill="#10192e"/>
      <circle cx="8" cy="-6" r="3" fill="#ffd24d"/>
      <path d="M8 0 L14 -5 L17 0 L14 5 Z" fill="#ffd24d"/>
    </g>
    <g id="playIcon">
      <circle r="13" fill="#ff8b3d" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>
      <circle r="4" fill="#fff"/>
      <path d="M-6 -8 L4 0 L-6 8 Z" fill="#fff" transform="translate(0,0)"/>
    </g>
  </defs>

  <!-- ===== фон участка ===== -->
  <rect width="1200" height="860" fill="url(#bgLot)"/>

  <!-- ===== внешние/чужие дома маскируем зелёными пятнами ===== -->
  <g fill="url(#greenZone)" opacity="0.85">
    <ellipse cx="70" cy="140" rx="90" ry="70"/>
    <ellipse cx="1130" cy="120" rx="120" ry="80"/>
    <ellipse cx="1120" cy="760" rx="110" ry="80"/>
    <ellipse cx="90" cy="720" rx="100" ry="75"/>
    <ellipse cx="600" cy="60" rx="200" ry="70"/>
  </g>

  <!-- ===== дороги ===== -->
  <g id="roads">
    <!-- горизонтальная дорога через двор -->
    <rect x="0" y="430" width="1200" height="46" fill="#d9dde0"/>
    <rect x="0" y="451" width="1200" height="4" fill="#ffffff" opacity="0.9"/>
    <path d="M0 453 L1200 453" stroke="#c3c8cc" stroke-width="1" opacity="0.6"/>
    <!-- вертикальная дорога Советская слева -->
    <rect x="88" y="0" width="52" height="860" fill="#cbd7e6"/>
    <rect x="110" y="0" width="3" height="860" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- ===== ЖК АквиЛон Reka: корпуса вокруг внутреннего двора ===== -->
  <g id="buildings" filter="url(#softshadow)">
    <!-- северное крыло -->
    <rect x="250" y="120" width="700" height="60" rx="6" fill="#8d99a6"/>
    <rect x="250" y="120" width="700" height="60" rx="6" fill="none" stroke="#5c6a77" stroke-width="2"/>
    <!-- восточное крыло -->
    <rect x="880" y="180" width="60" height="250" rx="6" fill="#98a4b0"/>
    <!-- южное крыло -->
    <rect x="250" y="620" width="700" height="60" rx="6" fill="#8d99a6"/>
    <!-- западное крыло -->
    <rect x="190" y="180" width="60" height="250" rx="6" fill="#98a4b0"/>
    <!-- внутренние корпуса -->
    <rect x="380" y="240" width="120" height="90" rx="5" fill="#aab4bf"/>
    <rect x="700" y="240" width="120" height="90" rx="5" fill="#aab4bf"/>
    <rect x="520" y="320" width="160" height="90" rx="5" fill="#9da9b5"/>
    <!-- башни -->
    <rect x="290" y="360" width="70" height="110" rx="4" fill="#b5bfc9"/>
    <rect x="840" y="360" width="70" height="110" rx="4" fill="#b5bfc9"/>
  </g>

  <!-- ===== подпись ЖК ===== -->
  <text x="600" y="100" text-anchor="middle" font-size="26" font-weight="700" fill="#3d5a80">ЖК «АквиЛон Reka»</text>

  <!-- ===== детская площадка Улыбка ===== -->
  <g id="playground">
    <rect x="470" y="140" width="260" height="90" rx="14" fill="none" stroke="#2a9df4" stroke-width="3" stroke-dasharray="10 6"/>
    <use href="#playIcon" x="560" y="185"/>
    <text x="600" y="255" text-anchor="middle" font-size="17" font-weight="600" fill="#1c7ed6">Улыбка</text>
  </g>

  <!-- ===== внутренний двор ===== -->
  <rect x="260" y="185" width="620" height="430" fill="none" stroke="#7ea06a" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- ===== деревья/зелёные зоны ===== -->
  <g fill="#7fb069">
    <circle cx="330" cy="130" r="18"/><circle cx="360" cy="120" r="15"/>
    <circle cx="510" cy="120" r="15"/><circle cx="700" cy="125" r="16"/>
    <circle cx="330" cy="670" r="17"/><circle cx="520" cy="665" r="15"/>
    <circle cx="780" cy="670" r="16"/><circle cx="880" cy="660" r="15"/>
    <circle cx="250" cy="300" r="14"/><circle cx="940" cy="320" r="14"/>
  </g>

  <!-- ===== парковки (P) ===== -->
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <g transform="translate(330,420)">
      <rect x="-18" y="-18" width="36" height="36" rx="6" fill="#2a9df4"/><text y="6">P</text>
    </g>
    <g transform="translate(870,420)">
      <rect x="-18" y="-18" width="36" height="36" rx="6" fill="#2a9df4"/><text y="6">P</text>
    </g>
  </g>

  <!-- название дороги -->
  <text x="114" y="820" transform="rotate(-90 114 820)" text-anchor="middle" font-size="16" font-weight="600" fill="#6b7785">ул. Советская</text>

  <!-- =========================================================== -->
  <!--   КАМЕРЫ С СЕКТОРАМИ ОБЗОРА  (пример)                       -->
  <!--   Сектор: полупрозрачный веер (конус FOV) от точки камеры   -->
  <!--   Номер камеры -> camera.entity_id (привязка в HA)          -->
  <!-- =========================================================== -->

  <!-- КАМЕРА 1: детская площадка (сектор на северо-запад) -->
  <g id="camera-1">
    <path d="M560 205 L505 120 A95 95 0 0 1 620 122 Z"
          fill="#d62728" opacity="0.16" stroke="#d62728" stroke-width="1.5"/>
    <use href="#camIcon" x="560" y="205" id="camera.playground"/>
    <text x="560" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#b01215">КАМ1 · площадка</text>
  </g>

  <!-- КАМЕРА 2: входная группа / двор (сектор на юг) -->
  <g id="camera-2">
    <path d="M600 285 L560 400 A120 120 0 0 0 640 400 Z"
          fill="#ff8b00" opacity="0.15" stroke="#ff8b00" stroke-width="1.5"/>
    <use href="#camIcon" x="600" y="285" id="camera.courtyard"/>
    <text x="600" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#c96a00">КАМ2 · двор</text>
  </g>

  <!-- КАМЕРА 3: западная калитка (сектор на восток вдоль дороги) -->
  <g id="camera-3">
    <path d="M300 455 L430 420 A90 90 0 0 1 430 490 Z"
          fill="#2e9e44" opacity="0.16" stroke="#2e9e44" stroke-width="1.5"/>
    <use href="#camIcon" x="300" y="455" id="camera.gate_west"/>
    <text x="300" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#1d7a2e">КАМ3 · калитка З</text>
  </g>

  <!-- КАМЕРА 4: восточная калитка (сектор на запад) -->
  <g id="camera-4">
    <path d="M900 455 L770 420 A90 90 0 0 1 770 490 Z"
          fill="#2e9e44" opacity="0.16" stroke="#2e9e44" stroke-width="1.5"/>
    <use href="#camIcon" x="900" y="455" id="camera.gate_east"/>
    <text x="900" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#1d7a2e">КАМ4 · калитка В</text>
  </g>

  <!-- КАМЕРА 5: парковка у южного корпуса (сектор на юго-запад) -->
  <g id="camera-5">
    <path d="M520 655 L450 730 A110 110 0 0 1 545 745 Z"
          fill="#7d5bb8" opacity="0.16" stroke="#7d5bb8" stroke-width="1.5"/>
    <use href="#camIcon" x="520" y="655" id="camera.parking_south"/>
    <text x="520" y="682" text-anchor="middle" font-size="13" font-weight="700" fill="#5c3f8f">КАМ5 · парковка</text>
  </g>

  <!-- ===== условные обозначения ===== -->
  <g id="legend" transform="translate(960,620)">
    <rect x="0" y="0" width="220" height="210" rx="10" fill="#ffffff" stroke="#ccd6dd" stroke-width="1.5" opacity="0.95"/>
    <text x="110" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#2f3b45">Условные обозначения</text>
    <g>
      <rect x="18" y="44" width="24" height="18" rx="3" fill="#8d99a6" stroke="#5c6a77" stroke-width="1"/>
      <text x="52" y="58" font-size="12" fill="#3f4a55">корпуса ЖК</text>
    </g>
    <g>
      <rect x="18" y="74" width="24" height="18" rx="8" fill="none" stroke="#2a9df4" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="52" y="88" font-size="12" fill="#3f4a55">детская площадка</text>
    </g>
    <g>
      <path d="M30 110 L20 98 A14 14 0 0 1 40 98 Z" fill="#d62728" opacity="0.4" stroke="#d62728" stroke-width="1.2"/>
      <text x="52" y="109" font-size="12" fill="#3f4a55">сектор обзора камеры</text>
    </g>
    <g>
      <rect x="15" y="126" width="30" height="22" rx="3" fill="#1f2a44"/>
      <text x="52" y="141" font-size="12" fill="#3f4a55">камера (клик — просмотр)</text>
    </g>
    <g>
      <rect x="22" y="158" width="18" height="18" rx="4" fill="#2a9df4"/>
      <text x="52" y="172" font-size="12" fill="#3f4a55">парковка</text>
    </g>
  </g>
</svg>